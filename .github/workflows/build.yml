name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build release APK
        run: gradle :app:assembleRelease --no-daemon --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk CardWidget-v${{ github.run_number }}.apk

      - uses: actions/upload-artifact@v4
        with:
          name: CardWidget-APK
          path: CardWidget-v${{ github.run_number }}.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: 카드실적 위젯 v${{ github.run_number }}
          body: 폰에서 아래 APK 파일을 눌러 다운로드 후 설치하세요.
          files: CardWidget-v${{ github.run_number }}.apk
          make_latest: true
